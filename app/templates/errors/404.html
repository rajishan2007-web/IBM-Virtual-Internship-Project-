{% extends "base.html" %}

{% block title %}Page Not Found — SPAS{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm border-0">
            <div class="card-body py-5">
                <i class="bi bi-search display-1 text-secondary mb-3 d-block"></i>
                <h1 class="fw-bold">404</h1>
                <h4 class="text-secondary mb-3">Page Not Found</h4>
                <p class="text-muted mb-4">The page you are looking for does not exist or has been moved.</p>
                <a href="{{ url_for('auth.index') }}" class="btn btn-primary">
                    <i class="bi bi-house me-1"></i> Go Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
