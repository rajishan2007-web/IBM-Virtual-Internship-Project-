{% extends "base.html" %}

{% block title %}Access Forbidden — SPAS{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm border-0">
            <div class="card-body py-5">
                <i class="bi bi-lock display-1 text-danger mb-3 d-block"></i>
                <h1 class="fw-bold">403</h1>
                <h4 class="text-secondary mb-3">Access Forbidden</h4>
                <p class="text-muted mb-4">You do not have permission to access this page.</p>
                <a href="{{ url_for('auth.index') }}" class="btn btn-primary">
                    <i class="bi bi-house me-1"></i> Go Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
