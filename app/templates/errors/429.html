{% extends "base.html" %}

{% block title %}Too Many Requests — SPAS{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm border-0">
            <div class="card-body py-5">
                <i class="bi bi-shield-exclamation display-1 text-warning mb-3 d-block"></i>
                <h1 class="fw-bold">429</h1>
                <h4 class="text-secondary mb-3">Too Many Requests</h4>
                <p class="text-muted mb-4">You have made too many login attempts. Please wait a minute before trying again.</p>
                <a href="{{ url_for('auth.login') }}" class="btn btn-primary">
                    <i class="bi bi-arrow-left me-1"></i> Back to Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
